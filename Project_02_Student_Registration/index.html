<!DOCTYPE html><html><head><title>Student Registration</title><link rel="stylesheet" href="style.css"></head><body><nav><b>Student Registration</b></nav><main class="container"><div class="card"><h1>Student Registration Form</h1><form id="reg"><label>Full Name</label><input id="name" required><label>Email</label><input type="email" required><label>Phone</label><input pattern="[0-9]{10}" placeholder="10 digit number" required><label>Date of Birth</label><input type="date" required><label>Department</label><select required><option value="">Select</option><option>CSE</option><option>ECE</option><option>EEE</option><option>Mechanical</option></select><label>Gender</label><select required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select><label>Address</label><textarea required></textarea><button class="btn">Register</button></form><div id="result"></div></div></main><script src="script.js"></script></body></html>
